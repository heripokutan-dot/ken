# Cloudflare Pages build settings for the hosted iPhone app.
# This file holds NO account IDs, database IDs, secrets, hostnames, or personal data.
#
# Bindings and Secrets are configured in the Cloudflare Pages dashboard, NOT in this file:
#   Secrets (encrypted):  GEMINI_API_KEY, AUTH_PROVIDER ("google"), GOOGLE_CLIENT_ID, ALLOWED_EMAIL
#   D1 database binding:  RATE_LIMIT_DB -> the D1 database created from migrations/0001_rate_limits.sql
#
# Why: Pages fields defined in a Wrangler file cannot be edited in the dashboard afterwards, so bindings
# are kept in one place (the dashboard). Do not add [[d1_databases]] here unless you move the binding
# out of the dashboard on purpose; see docs/superpowers/plans/2026-10-27-gemini-live-iphone-cloudflare-setup.md.
#
# The token endpoint fails closed (503) until RATE_LIMIT_DB and the sign-in settings are present.
# Rate limiting uses D1 because the Rate Limiting binding is not a supported Pages Functions binding.
name = "ken-live"
pages_build_output_dir = "frontend"
compatibility_date = "2026-10-01"
